<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">LedgerDesk macOS UI review excerpt</title>
  <desc id="desc">A rendered excerpt of the evidence-bounded LedgerDesk UI review with one blocking and one important finding.</desc>
  <rect width="1440" height="900" fill="#F4F7F6"/>
  <rect x="72" y="64" width="1296" height="772" rx="18" fill="#FFFFFF" stroke="#D7E2DF" stroke-width="2"/>
  <rect x="72" y="64" width="16" height="772" rx="8" fill="#007A6E"/>
  <text x="128" y="132" fill="#17322E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" font-weight="600">APPLE UI REVIEW  /  TEXT EVIDENCE</text>
  <text x="128" y="194" fill="#12211F" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="44" font-weight="700">LedgerDesk macOS reconciliation</text>
  <text x="128" y="238" fill="#536B66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22">Two actionable findings. Visual and runtime behavior remain unverified.</text>

  <rect x="128" y="294" width="1184" height="194" rx="12" fill="#FFF4EF" stroke="#F0C8B8" stroke-width="2"/>
  <rect x="152" y="320" width="118" height="36" rx="18" fill="#A33B29"/>
  <text x="173" y="345" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="700">BLOCKING</text>
  <text x="152" y="397" fill="#321C17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="28" font-weight="700">Matched state is communicated by color alone</text>
  <text x="152" y="438" fill="#5E4943" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20">Preserve the warm system, add a non-color status cue, then verify the real Mac app.</text>
  <text x="152" y="466" fill="#5E4943" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20">VoiceOver and actual contrast remain separate runtime checks.</text>

  <rect x="128" y="516" width="1184" height="194" rx="12" fill="#F4F8F7" stroke="#BFD5D0" stroke-width="2"/>
  <rect x="152" y="542" width="128" height="36" rx="18" fill="#176B62"/>
  <text x="171" y="567" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="700">IMPORTANT</text>
  <text x="152" y="619" fill="#17322E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="28" font-weight="700">Confirm and remove actions compete at equal weight</text>
  <text x="152" y="660" fill="#536B66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20">Clarify the primary action by relationship state, then test pointer, keyboard,</text>
  <text x="152" y="688" fill="#536B66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20">dialog behavior, and focus recovery in the running app.</text>

  <path d="M128 758h1184" stroke="#D7E2DF" stroke-width="2"/>
  <text x="128" y="798" fill="#536B66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18">Supported: evidence-bounded review delivery</text>
  <text x="720" y="798" fill="#536B66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18">Not supported: visual/runtime validation or user acceptance</text>
</svg>
