<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>FrameKeep — First-run import flow prototype</title>
  <style>
    :root {
      color-scheme: light;
      --surface-base: #f5f2eb;
      --surface-raised: #fffdf8;
      --surface-soft: #ebe7dc;
      --content-primary: #1f2924;
      --content-secondary: #5f6a64;
      --content-critical: #8d3b31;
      --action-primary: #275c46;
      --action-primary-pressed: #1d4736;
      --action-secondary: #e5eee9;
      --focus-ring: #2f70dc;
      --border: #d9d5ca;
      --shadow: 0 20px 60px rgba(33, 41, 37, .12);
      --radius-control: 14px;
      --radius-card: 24px;
      --spacing-related: 12px;
      --spacing-section: 28px;
      --motion-transition: 180ms;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
      background: var(--surface-base);
      color: var(--content-primary);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100svh;
      background:
        radial-gradient(circle at 10% 0%, rgba(255,255,255,.9), transparent 34rem),
        var(--surface-base);
    }

    button, select { font: inherit; }

    button {
      min-height: 48px;
      border: 0;
      border-radius: var(--radius-control);
      padding: 13px 18px;
      font-weight: 700;
      cursor: pointer;
      transition: transform var(--motion-transition) ease, background var(--motion-transition) ease;
    }

    button:active:not(:disabled) { transform: scale(.98); }

    button:focus-visible, select:focus-visible {
      outline: 3px solid var(--focus-ring);
      outline-offset: 3px;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: .48;
    }

    .prototype-bar {
      position: relative;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      min-height: 52px;
      padding: 8px 16px;
      background: #2c2922;
      color: #fffdf8;
      font-size: 13px;
    }

    .prototype-bar strong {
      letter-spacing: .02em;
    }

    .prototype-bar label {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .prototype-bar select {
      min-height: 34px;
      border: 1px solid #777064;
      border-radius: 9px;
      padding: 4px 30px 4px 10px;
      color: #231f1a;
      background: #fffdf8;
    }

    .prototype-reset {
      min-height: 34px;
      padding: 5px 10px;
      border: 1px solid #777064;
      border-radius: 9px;
      color: #fffdf8;
      background: transparent;
      font-size: 13px;
    }

    .prototype-note {
      color: #d8d0c3;
    }

    main {
      min-height: calc(100svh - 52px);
      display: grid;
      place-items: center;
      padding: 28px 16px;
    }

    .app {
      position: relative;
      width: min(100%, 430px);
      min-height: min(760px, calc(100svh - 108px));
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background: var(--surface-raised);
      border: 1px solid rgba(49, 55, 51, .09);
      border-radius: 36px;
      box-shadow: var(--shadow);
    }

    .app-header {
      min-height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 22px 8px;
    }

    .brand-mini {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: -.01em;
    }

    .mini-mark {
      width: 22px;
      height: 18px;
      border: 2px solid var(--action-primary);
      border-radius: 5px;
      transform: rotate(-3deg);
      box-shadow: 4px 3px 0 -1px var(--surface-raised), 5px 4px 0 0 var(--action-primary);
    }

    .back-button {
      min-height: 42px;
      padding: 8px 5px;
      color: var(--action-primary);
      background: transparent;
    }

    .header-spacer { width: 42px; }

    .screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 18px 24px calc(24px + env(safe-area-inset-bottom));
      animation: screen-in var(--motion-transition) ease both;
    }

    @keyframes screen-in {
      from { opacity: 0; transform: translateY(7px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .eyebrow {
      margin: 0 0 10px;
      color: var(--action-primary);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      max-width: 14ch;
      font-size: clamp(32px, 9vw, 44px);
      line-height: 1.02;
      letter-spacing: -.045em;
    }

    h2 {
      margin: 0;
      font-size: 26px;
      line-height: 1.08;
      letter-spacing: -.03em;
    }

    p {
      margin: 0;
      color: var(--content-secondary);
      font-size: 16px;
      line-height: 1.52;
    }

    .lede {
      margin-top: 18px;
      max-width: 34ch;
      font-size: 18px;
    }

    .hero {
      flex: 1;
      display: grid;
      align-content: center;
      padding: 20px 0 40px;
    }

    .large-mark {
      position: relative;
      width: 92px;
      height: 74px;
      margin-bottom: 42px;
      border: 4px solid var(--action-primary);
      border-radius: 18px;
      transform: rotate(-4deg);
      background:
        linear-gradient(145deg, transparent 42%, rgba(39,92,70,.18) 43% 63%, transparent 64%),
        var(--surface-raised);
      box-shadow:
        11px 9px 0 -3px var(--surface-raised),
        13px 11px 0 -2px #9eb4a9,
        22px 18px 0 -5px var(--surface-raised),
        24px 20px 0 -4px var(--action-primary);
    }

    .large-mark::after {
      content: "";
      position: absolute;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      top: 14px;
      left: 17px;
      background: #c48c5d;
    }

    .actions {
      display: grid;
      gap: 10px;
      margin-top: auto;
      padding-top: 28px;
    }

    .primary {
      color: white;
      background: var(--action-primary);
    }

    .primary:hover { background: var(--action-primary-pressed); }

    .secondary {
      color: var(--action-primary);
      background: var(--action-secondary);
    }

    .text-action {
      color: var(--content-secondary);
      background: transparent;
    }

    .critical-secondary {
      color: var(--content-critical);
      background: #f7e9e6;
    }

    .privacy-card, .status-card {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 14px;
      margin-top: 28px;
      padding: 18px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: #faf8f2;
    }

    .privacy-icon, .status-icon {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      background: var(--action-secondary);
      color: var(--action-primary);
      font-weight: 900;
    }

    .status-icon.error {
      background: #f7e9e6;
      color: var(--content-critical);
    }

    .privacy-card strong, .status-card strong {
      display: block;
      margin-bottom: 3px;
      font-size: 15px;
    }

    .privacy-card p, .status-card p { font-size: 14px; }

    .steps {
      display: grid;
      gap: 16px;
      margin: 28px 0 0;
      padding: 0;
      list-style: none;
    }

    .steps li {
      display: grid;
      grid-template-columns: 30px 1fr;
      align-items: start;
      gap: 12px;
      color: var(--content-secondary);
      line-height: 1.4;
    }

    .step-number {
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: var(--action-primary);
      background: var(--action-secondary);
      font-size: 13px;
      font-weight: 800;
    }

    .photo-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 22px;
    }

    .photo {
      position: relative;
      min-height: 106px;
      aspect-ratio: .82;
      overflow: hidden;
      display: block;
      padding: 0;
      border: 3px solid transparent;
      border-radius: 14px;
      background: var(--photo-bg);
      box-shadow: inset 0 0 0 1px rgba(0,0,0,.06);
    }

    .photo::before {
      content: "";
      position: absolute;
      inset: 22% 18% -18% 14%;
      border-radius: 50% 50% 18% 18%;
      transform: rotate(var(--photo-tilt));
      background: var(--photo-shape);
      opacity: .92;
    }

    .photo::after {
      content: attr(data-index);
      position: absolute;
      top: 7px;
      right: 7px;
      width: 26px;
      height: 26px;
      display: grid;
      place-items: center;
      border: 2px solid rgba(255,255,255,.95);
      border-radius: 50%;
      color: transparent;
      background: rgba(28,34,31,.23);
      font-size: 13px;
      font-weight: 900;
    }

    .photo[aria-pressed="true"] {
      border-color: var(--action-primary);
    }

    .photo[aria-pressed="true"]::after {
      content: "✓";
      color: white;
      background: var(--action-primary);
    }

    .selection-summary {
      margin-top: 14px;
      color: var(--content-secondary);
      font-size: 14px;
      font-weight: 700;
    }

    .mock-boundary {
      margin: 12px 0 0;
      padding: 8px 10px;
      border-radius: 10px;
      color: #6f542d;
      background: #fff3cf;
      font-size: 12px;
      line-height: 1.4;
    }

    .progress-wrap {
      margin-top: 32px;
    }

    .progress-track {
      height: 10px;
      overflow: hidden;
      border-radius: 99px;
      background: var(--surface-soft);
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      border-radius: inherit;
      background: var(--action-primary);
      transition: width 160ms linear;
    }

    .progress-meta {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      margin-top: 10px;
      color: var(--content-secondary);
      font-size: 14px;
    }

    .collection-title {
      margin-top: 4px;
    }

    .collection-grid {
      display: grid;
      grid-template-columns: 1.45fr 1fr;
      grid-template-rows: repeat(2, 116px);
      gap: 8px;
      margin-top: 24px;
    }

    .collection-tile {
      border-radius: 16px;
      background: var(--photo-bg);
    }

    .collection-tile:first-child { grid-row: 1 / 3; }

    .completion-note {
      margin-top: 18px;
      color: var(--action-primary);
      font-weight: 750;
    }

    .dialog-backdrop {
      position: absolute;
      z-index: 40;
      inset: 0;
      display: grid;
      align-items: end;
      padding: 18px;
      background: rgba(25, 29, 27, .45);
      backdrop-filter: blur(6px);
      animation: fade-in 140ms ease both;
    }

    .dialog {
      padding: 22px 18px 16px;
      border-radius: 24px;
      background: #fff;
      box-shadow: 0 18px 48px rgba(0,0,0,.2);
    }

    .dialog-system-label {
      margin-bottom: 12px;
      color: #745e37;
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .06em;
    }

    .dialog h2 { font-size: 22px; }
    .dialog p { margin-top: 10px; font-size: 15px; }
    .dialog .actions { padding-top: 18px; }

    @keyframes fade-in {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 520px) {
      .prototype-bar {
        flex-wrap: wrap;
        justify-content: flex-start;
      }

      .prototype-note { display: none; }

      main {
        min-height: calc(100svh - 80px);
        display: block;
        padding: 0;
      }

      .app {
        width: 100%;
        min-height: calc(100svh - 80px);
        border: 0;
        border-radius: 0;
        box-shadow: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: .001ms !important;
        transition-duration: .001ms !important;
      }
    }
  </style>
</head>
<body>
  <aside class="prototype-bar" aria-label="Prototype-only controls">
    <strong>Prototype controls</strong>
    <span class="prototype-note">Not part of FrameKeep</span>
    <label>
      Next import
      <select id="import-outcome" aria-label="Choose next simulated import result">
        <option value="success">Succeeds</option>
        <option value="failure">Fails once</option>
      </select>
    </label>
    <button class="prototype-reset" id="prototype-reset" type="button">Reset</button>
  </aside>

  <main>
    <section class="app" id="app" data-state="welcome" aria-label="FrameKeep first-run prototype"></section>
  </main>

  <div class="sr-only" id="announcer" aria-live="polite" aria-atomic="true"></div>

  <script>
    (() => {
      const app = document.querySelector("#app");
      const announcer = document.querySelector("#announcer");
      const outcomeControl = document.querySelector("#import-outcome");
      const resetControl = document.querySelector("#prototype-reset");

      const photos = [
        ["#d6c4a6", "#8e724e", "-7deg"],
        ["#bac8c5", "#55736c", "8deg"],
        ["#e1b7a5", "#a85e49", "-3deg"],
        ["#cbd2ad", "#76865a", "5deg"],
        ["#b9c4d3", "#5e708e", "-8deg"],
        ["#dfc6cf", "#9c687b", "7deg"]
      ];

      let state = "welcome";
      let selected = new Set();
      let progress = 0;
      let permissionTrigger = null;
      let importTimer = null;

      const header = (backTarget = null) => `
        <header class="app-header">
          ${backTarget ? `<button class="back-button" type="button" data-action="back" data-target="${backTarget}" aria-label="Go back">‹ Back</button>` : `<span class="brand-mini"><span class="mini-mark" aria-hidden="true"></span>FrameKeep</span>`}
          ${backTarget ? `<span class="brand-mini">FrameKeep</span>` : ""}
          <span class="header-spacer" aria-hidden="true"></span>
        </header>
      `;

      const actions = (primary, secondary = "") => `
        <div class="actions">${primary}${secondary}</div>
      `;

      const announce = message => {
        announcer.textContent = "";
        window.setTimeout(() => { announcer.textContent = message; }, 20);
      };

      const stopImport = () => {
        if (importTimer) window.clearInterval(importTimer);
        importTimer = null;
      };

      const setState = (next, options = {}) => {
        stopImport();
        state = next;
        render();
        if (!options.skipFocus) {
          window.requestAnimationFrame(() => {
            const heading = app.querySelector("h1, h2");
            if (heading) {
              heading.setAttribute("tabindex", "-1");
              heading.focus();
            }
          });
        }
      };

      const renderWelcome = () => `
        ${header()}
        <div class="screen">
          <div class="hero">
            <div class="large-mark" aria-hidden="true"></div>
            <p class="eyebrow">Your references, kept close</p>
            <h1>Build a small collection from photos you choose.</h1>
            <p class="lede">FrameKeep starts private. Nothing is available to the app until you select it.</p>
          </div>
          ${actions(`<button class="primary" type="button" data-action="start">Get started</button>`)}
        </div>
      `;

      const renderExplanation = () => `
        ${header("welcome")}
        <div class="screen">
          <p class="eyebrow">Before we ask</p>
          <h1>Choose only the photos you want in FrameKeep.</h1>
          <p class="lede">Your selection becomes a small reference collection. FrameKeep does not need access to your full library.</p>
          <ol class="steps">
            <li><span class="step-number">1</span><span>iOS asks which photos you want to share.</span></li>
            <li><span class="step-number">2</span><span>You review and import the selected items.</span></li>
            <li><span class="step-number">3</span><span>Your first collection opens when import finishes.</span></li>
          </ol>
          <div class="privacy-card">
            <span class="privacy-icon" aria-hidden="true">⌁</span>
            <div><strong>Minimum access</strong><p>You can change the shared selection later in Settings.</p></div>
          </div>
          ${actions(`<button class="primary" type="button" data-action="open-permission">Choose photos</button>`)}
        </div>
      `;

      const renderDenied = () => `
        ${header()}
        <div class="screen">
          <div class="hero">
            <p class="eyebrow">No access granted</p>
            <h1>FrameKeep still cannot see any photos.</h1>
            <p class="lede">To create a collection, try again and choose the photos you want to share. You remain in control.</p>
            <div class="status-card">
              <span class="status-icon error" aria-hidden="true">!</span>
              <div><strong>Permission denied</strong><p>No photos were selected or imported.</p></div>
            </div>
          </div>
          ${actions(
            `<button class="primary" type="button" data-action="open-permission">Try again</button>`,
            `<button class="text-action" type="button" data-action="not-now">Not now</button>`
          )}
        </div>
      `;

      const renderLimited = () => `
        ${header("explanation")}
        <div class="screen">
          <div class="hero">
            <p class="eyebrow">Selected access</p>
            <h1>Only your chosen photos will be available.</h1>
            <p class="lede">FrameKeep will open a selection view next. You can change your choices before importing.</p>
            <div class="status-card">
              <span class="status-icon" aria-hidden="true">✓</span>
              <div><strong>Limited access granted</strong><p>Your full photo library remains outside FrameKeep.</p></div>
            </div>
          </div>
          ${actions(`<button class="primary" type="button" data-action="continue-selection">Continue</button>`)}
        </div>
      `;

      const renderSelection = () => {
        const grid = photos.map((photo, index) => {
          const id = String(index + 1);
          const isSelected = selected.has(id);
          return `
            <button
              class="photo"
              type="button"
              data-action="toggle-photo"
              data-id="${id}"
              data-index="${index + 1}"
              aria-label="Reference photo ${index + 1}${isSelected ? ", selected" : ""}"
              aria-pressed="${isSelected}"
              style="--photo-bg:${photo[0]};--photo-shape:${photo[1]};--photo-tilt:${photo[2]}"
            ></button>
          `;
        }).join("");

        return `
          ${header()}
          <div class="screen">
            <p class="eyebrow">Mock photo picker</p>
            <h2>Select references</h2>
            <p class="mock-boundary">Prototype boundary: these are representative items, not your Photos library or the native iOS picker.</p>
            <div class="photo-grid" role="group" aria-label="Representative photos">${grid}</div>
            <p class="selection-summary" id="selection-summary">${selected.size} selected</p>
            ${actions(
              `<button class="primary" type="button" data-action="import" ${selected.size ? "" : "disabled"}>Import ${selected.size ? selected.size : ""} selected</button>`,
              `<button class="text-action" type="button" data-action="cancel-picker">Cancel</button>`
            )}
          </div>
        `;
      };

      const renderImporting = () => `
        ${header()}
        <div class="screen">
          <div class="hero">
            <p class="eyebrow">Creating your collection</p>
            <h1>Importing ${selected.size} selected ${selected.size === 1 ? "photo" : "photos"}…</h1>
            <p class="lede">Keep FrameKeep open for this prototype step.</p>
            <div class="progress-wrap">
              <div class="progress-track" role="progressbar" aria-label="Import progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${progress}">
                <div class="progress-bar" style="width:${progress}%"></div>
              </div>
              <div class="progress-meta"><span>Preparing collection</span><span>${progress}%</span></div>
            </div>
          </div>
          ${actions(`<button class="secondary" type="button" data-action="cancel-import">Cancel import</button>`)}
        </div>
      `;

      const renderFailure = () => `
        ${header()}
        <div class="screen">
          <div class="hero">
            <p class="eyebrow">Nothing was lost</p>
            <h1>We couldn’t finish the import.</h1>
            <p class="lede">Your ${selected.size} ${selected.size === 1 ? "selection is" : "selections are"} still ready. Try the import again or review the selection.</p>
            <div class="status-card">
              <span class="status-icon error" aria-hidden="true">!</span>
              <div><strong>Import interrupted</strong><p>No collection was created, and no partial result is shown.</p></div>
            </div>
          </div>
          ${actions(
            `<button class="primary" type="button" data-action="retry-import">Retry import</button>`,
            `<button class="secondary" type="button" data-action="review-selection">Review selection</button>`
          )}
        </div>
      `;

      const renderComplete = () => {
        const imported = [...selected].slice(0, 3).map(id => {
          const photo = photos[Number(id) - 1];
          return `<div class="collection-tile" aria-hidden="true" style="--photo-bg:${photo[0]};background:${photo[0]}"></div>`;
        }).join("");
        return `
          ${header()}
          <div class="screen">
            <p class="eyebrow">Collection ready</p>
            <h1 class="collection-title">First references</h1>
            <p class="lede">${selected.size} ${selected.size === 1 ? "photo is" : "photos are"} now in your first collection.</p>
            <div class="collection-grid" aria-label="Imported representative photos">${imported}</div>
            <p class="completion-note">Only the photos you selected were imported.</p>
            ${actions(`<button class="secondary" type="button" data-action="reset">Reset prototype</button>`)}
          </div>
        `;
      };

      const renderPermissionDialog = () => `
        <div class="dialog-backdrop">
          <section class="dialog" role="dialog" aria-modal="true" aria-labelledby="permission-title" aria-describedby="permission-description">
            <p class="dialog-system-label">Simulated iOS permission handoff</p>
            <h2 id="permission-title">Allow FrameKeep to access photos?</h2>
            <p id="permission-description">This prototype does not open the native picker. Choose a result to continue testing the flow.</p>
            <div class="actions">
              <button class="primary" type="button" data-action="allow-limited">Allow selected photos</button>
              <button class="critical-secondary" type="button" data-action="deny">Don’t allow</button>
            </div>
          </section>
        </div>
      `;

      const render = () => {
        const views = {
          welcome: renderWelcome,
          explanation: renderExplanation,
          denied: renderDenied,
          limited: renderLimited,
          selection: renderSelection,
          importing: renderImporting,
          failure: renderFailure,
          complete: renderComplete
        };
        app.dataset.state = state;
        app.innerHTML = views[state]();
      };

      const openPermission = trigger => {
        permissionTrigger = trigger;
        app.dataset.state = "permission";
        app.insertAdjacentHTML("beforeend", renderPermissionDialog());
        window.requestAnimationFrame(() => {
          const firstButton = app.querySelector(".dialog button");
          if (firstButton) firstButton.focus();
        });
      };

      const closePermissionTo = next => {
        const dialog = app.querySelector(".dialog-backdrop");
        if (dialog) dialog.remove();
        setState(next);
      };

      const beginImport = () => {
        progress = 8;
        setState("importing");
        announce("Import started");
        let steps = 0;
        importTimer = window.setInterval(() => {
          steps += 1;
          progress = Math.min(92, progress + 21);
          const progressTrack = app.querySelector('[role="progressbar"]');
          const progressBar = app.querySelector(".progress-bar");
          const progressValue = app.querySelector(".progress-meta span:last-child");
          if (progressTrack) progressTrack.setAttribute("aria-valuenow", String(progress));
          if (progressBar) progressBar.style.width = `${progress}%`;
          if (progressValue) progressValue.textContent = `${progress}%`;
          if (steps >= 4) {
            stopImport();
            window.setTimeout(() => {
              if (outcomeControl.value === "failure") {
                outcomeControl.value = "success";
                setState("failure");
                announce("Import failed. Your selection is preserved.");
              } else {
                progress = 100;
                setState("complete");
                announce("Import complete. First references collection is ready.");
              }
            }, 120);
          }
        }, 140);
      };

      app.addEventListener("click", event => {
        const button = event.target.closest("button[data-action]");
        if (!button) return;
        const action = button.dataset.action;

        if (action === "start") setState("explanation");
        if (action === "back") setState(button.dataset.target);
        if (action === "open-permission") openPermission(button);
        if (action === "allow-limited") closePermissionTo("limited");
        if (action === "deny") closePermissionTo("denied");
        if (action === "not-now") setState("welcome");
        if (action === "continue-selection") setState("selection");
        if (action === "cancel-picker") setState("explanation");
        if (action === "toggle-photo") {
          const id = button.dataset.id;
          selected.has(id) ? selected.delete(id) : selected.add(id);
          render();
          window.requestAnimationFrame(() => {
            const updated = app.querySelector(`[data-id="${id}"]`);
            if (updated) updated.focus();
          });
          announce(`${selected.size} selected`);
        }
        if (action === "import") beginImport();
        if (action === "cancel-import") {
          setState("selection");
          announce("Import cancelled. Your selection is preserved.");
        }
        if (action === "retry-import") beginImport();
        if (action === "review-selection") setState("selection");
        if (action === "reset") reset();
      });

      document.addEventListener("keydown", event => {
        const dialog = app.querySelector(".dialog");
        if (!dialog) return;
        if (event.key === "Escape") {
          event.preventDefault();
          const backdrop = app.querySelector(".dialog-backdrop");
          if (backdrop) backdrop.remove();
          app.dataset.state = state;
          if (permissionTrigger) permissionTrigger.focus();
          announce("Permission handoff dismissed");
          return;
        }
        if (event.key !== "Tab") return;
        const buttons = [...dialog.querySelectorAll("button")];
        const first = buttons[0];
        const last = buttons[buttons.length - 1];
        if (event.shiftKey && document.activeElement === first) {
          event.preventDefault();
          last.focus();
        } else if (!event.shiftKey && document.activeElement === last) {
          event.preventDefault();
          first.focus();
        }
      });

      const reset = () => {
        stopImport();
        selected = new Set();
        progress = 0;
        outcomeControl.value = "success";
        setState("welcome");
        announce("Prototype reset");
      };

      resetControl.addEventListener("click", reset);
      render();
    })();
  </script>
</body>
</html>
